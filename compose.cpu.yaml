services:
  parsec-music-worker-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: ghcr.io/roughzahn/parsec-music-worker:${PARSEC_WORKER_VERSION:-0.1.0}-cpu
    container_name: parsec-music-worker-cpu
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      PARSEC_GATEWAY_BASE_URL: ${PARSEC_GATEWAY_BASE_URL:?Set PARSEC_GATEWAY_BASE_URL}
      PARSEC_WORKER_TOKEN: ${PARSEC_WORKER_TOKEN:?Set PARSEC_WORKER_TOKEN}
      PARSEC_WORKER_ID: ${PARSEC_WORKER_ID:-cpu-${HOSTNAME}}
      PARSEC_WORKER_TYPE: cpu
      PARSEC_CLAP_MODEL_PATH: /models/630k-audioset-best.pt
      PARSEC_WORKER_HEALTH_PORT: "8081"
    volumes:
      - ${PARSEC_MODEL_PATH:-C:/parsec/models}:/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
