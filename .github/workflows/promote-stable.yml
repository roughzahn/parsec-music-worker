name: Promote stable image tags

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing worker release version to promote (without -cpu/-gpu)"
        required: true
        default: "0.2.0"
        type: string

permissions:
  packages: write

concurrency:
  group: parsec-music-worker-stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote existing CPU/GPU release to stable tags
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch and validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Promotion may only run from main."; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Version must be stable semantic version, e.g. 0.2.0"
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify source manifests and promote both variants
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          docker buildx imagetools inspect "$IMAGE:$VERSION-cpu"
          docker buildx imagetools inspect "$IMAGE:$VERSION-gpu"
          docker buildx imagetools create --tag "$IMAGE:stable-cpu" "$IMAGE:$VERSION-cpu"
          docker buildx imagetools create --tag "$IMAGE:stable-gpu" "$IMAGE:$VERSION-gpu"
          {
            echo "### Stable tags promoted"
            echo
            echo "- CPU: $IMAGE:$VERSION-cpu -> $IMAGE:stable-cpu"
            echo "- GPU: $IMAGE:$VERSION-gpu -> $IMAGE:stable-gpu"
          } >> "$GITHUB_STEP_SUMMARY"
