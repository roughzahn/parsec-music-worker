name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish CPU/GPU images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CPU image tags
        id: cpu-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/roughzahn/parsec-music-worker
          tags: |
            type=semver,pattern={{version}},suffix=-cpu
            type=raw,value=latest-cpu

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          push: true
          tags: ${{ steps.cpu-meta.outputs.tags }}
          labels: ${{ steps.cpu-meta.outputs.labels }}
          cache-from: type=gha,scope=worker-cpu
          cache-to: type=gha,mode=max,scope=worker-cpu

      - name: Prepare GPU image tags
        id: gpu-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/roughzahn/parsec-music-worker
          tags: |
            type=semver,pattern={{version}},suffix=-gpu
            type=raw,value=latest-gpu

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          tags: ${{ steps.gpu-meta.outputs.tags }}
          labels: ${{ steps.gpu-meta.outputs.labels }}
          cache-from: type=gha,scope=worker-gpu
          cache-to: type=gha,mode=max,scope=worker-gpu

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
