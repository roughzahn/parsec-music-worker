name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the latest semantic version should be incremented?"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

concurrency:
  group: parsec-music-worker-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish CPU/GPU images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main branch and calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases may only be created from main."
            exit 1
          fi

          LATEST_TAG="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)"
          if [[ -z "$LATEST_TAG" ]]; then
            CURRENT_VERSION="0.0.0"
          else
            CURRENT_VERSION="${LATEST_TAG#v}"
          fi

          if [[ ! "$CURRENT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Latest release tag '$LATEST_TAG' is not a valid stable semantic version."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Unsupported version increment: $BUMP"
              exit 1
              ;;
          esac

          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### Release version"
            echo
            echo "- Previous version: $CURRENT_VERSION"
            echo "- Increment: $BUMP"
            echo "- New version: $VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Git tag v$VERSION already exists."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CPU image tags
        id: cpu-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/roughzahn/parsec-music-worker
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-cpu
            type=raw,value=latest-cpu

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          push: true
          tags: ${{ steps.cpu-meta.outputs.tags }}
          labels: ${{ steps.cpu-meta.outputs.labels }}
          cache-from: type=gha,scope=worker-cpu
          cache-to: type=gha,mode=max,scope=worker-cpu

      - name: Prepare GPU image tags
        id: gpu-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/roughzahn/parsec-music-worker
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-gpu
            type=raw,value=latest-gpu

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          tags: ${{ steps.gpu-meta.outputs.tags }}
          labels: ${{ steps.gpu-meta.outputs.labels }}
          cache-from: type=gha,scope=worker-gpu
          cache-to: type=gha,mode=max,scope=worker-gpu

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "parsec-music-worker v$VERSION" --generate-notes
