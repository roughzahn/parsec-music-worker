name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example: 0.1.3)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish CPU/GPU images
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH without a v prefix (for example 0.1.3)."
            exit 1
          fi

          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists. Choose a new version."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CPU image tags
        id: cpu-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/roughzahn/parsec-music-worker
          tags: |
            type=raw,value=${{ inputs.version }}-cpu
            type=raw,value=latest-cpu

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          push: true
          tags: ${{ steps.cpu-meta.outputs.tags }}
          labels: ${{ steps.cpu-meta.outputs.labels }}
          cache-from: type=gha,scope=worker-cpu
          cache-to: type=gha,mode=max,scope=worker-cpu

      - name: Prepare GPU image tags
        id: gpu-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/roughzahn/parsec-music-worker
          tags: |
            type=raw,value=${{ inputs.version }}-gpu
            type=raw,value=latest-gpu

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          tags: ${{ steps.gpu-meta.outputs.tags }}
          labels: ${{ steps.gpu-meta.outputs.labels }}
          cache-from: type=gha,scope=worker-gpu
          cache-to: type=gha,mode=max,scope=worker-gpu

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: main
          generate_release_notes: true
