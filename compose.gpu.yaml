services:
  parsec-music-worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: ghcr.io/roughzahn/parsec-music-worker:${PARSEC_WORKER_VERSION:-latest}-gpu
    container_name: parsec-music-worker-gpu
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      PARSEC_GATEWAY_BASE_URL: ${PARSEC_GATEWAY_BASE_URL:?Set PARSEC_GATEWAY_BASE_URL}
      PARSEC_WORKER_TOKEN: ${PARSEC_WORKER_TOKEN:?Set PARSEC_WORKER_TOKEN}
      PARSEC_WORKER_ID: ${PARSEC_WORKER_ID:-gpu-${HOSTNAME}}
      PARSEC_WORKER_TYPE: gpu
      PARSEC_CLAP_MODEL_PATH: /models/630k-audioset-best.pt
    volumes:
      - C:/parsec/models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
